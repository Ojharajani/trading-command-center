name: Supabase Keep Alive

# Free-tier Supabase projects pause after 7 days of inactivity.
# This runs a tiny read query every 3 days so the project stays active.

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 03:17 UTC
  workflow_dispatch: {}        # allows a manual run from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing repo secrets NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          # Real database read (RLS applies, so no private data is returned).
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "${SUPABASE_URL%/}/rest/v1/trades?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: ${status}"
          [ "${status}" = "200" ]
